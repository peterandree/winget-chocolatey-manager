[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wincoman"
version = "1.3.0"
description = "Find Windows apps unmanaged by WinGet/Chocolatey and register them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["windows", "winget", "chocolatey", "scoop", "package-manager"]
dependencies = [
    "rapidfuzz>=3.0",
]

[project.scripts]
wincoman = "wincoman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wincoman"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "coverage[toml]>=7.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/wincoman"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
